# Publica o site do Game Catalog (página de download do app Android, política de privacidade e termos)
# a partir da pasta docs/site do repositório oficial VPRODC83/gamecatalog-app.
# Roda uma vez por dia, a cada push neste repositório e à mão em Actions → Run workflow.
name: Publicar o site

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"   # todo dia, 06:23 em Brasília
  push:
    branches: [main]

permissions:
  contents: read
  pages: write       # publicar no GitHub Pages
  id-token: write    # exigido pelo deploy do Pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    if: github.repository_owner == 'VPRODC83'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: este

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: VPRODC83/gamecatalog-app
          path: fonte
          sparse-checkout: docs/site

      - name: Montar o site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp -r fonte/docs/site/. _site/
          # arquivos extras do dono do site (ex.: verificação do Google Search Console, .well-known/assetlinks.json)
          if [ -d este/extra ]; then cp -r este/extra/. _site/; rm -f _site/LEIA-ME.md; fi
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
